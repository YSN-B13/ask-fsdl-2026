[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-fsdl"
version = "0.1.0"
description = "RAG-based Q&A over Full Stack Deep Learning materials"
requires-python = ">=3.13,<3.14"

dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/the-full-stack/ask-fsdl"
Issues = "https://github.com/the-full-stack/ask-fsdl/issues"

[tool.ruff]
target-version = "py313"
exclude = [
    "*.ipynb",
    "Running ETL to Build the Document Corpus.ipynb",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B905"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "F401", "F841"]
